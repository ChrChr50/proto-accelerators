# CI for macc8.
#
# GitHub only looks for workflows in the repo root's .github/workflows/, so
# this file sits here even though the project is in macc8/. Every step runs
# from macc8/ (see `defaults`), and the `paths` filters keep it from running
# on changes elsewhere in the repo.
#
# A few choices worth knowing about:
# - The tools are the exact versions I use locally (macc8/env/tool-versions.md,
#   installed by macc8/scripts/ci_install_toolchain.sh). OSS-CAD-Suite ships
#   new builds almost daily and reproducible CI matters more to me than
#   running the newest one.
# - Each job writes its reports/<ts>_<target>/ folder like a local run would
#   and uploads it as an artifact, but doesn't commit it. A bot commit would
#   trigger CI again, and I'd like the committed reports to be runs someone
#   chose to keep.
# - The Icarus job skips the pinned cocotb venv on purpose; the comment on
#   that job explains why.
name: CI

on:
  push:
    paths:
      - "macc8/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "macc8/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: macc8

env:
  MACC8_TOOLS_ROOT: /home/runner/tools

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.MACC8_TOOLS_ROOT }}
          key: macc8-toolchain-oss-cad-suite-2026-07-11-verible-v0.0-4080-ga0a8d8eb

      - name: Install toolchain (Yosys, Verilator, Verible)
        run: bash scripts/ci_install_toolchain.sh

      - name: Lint
        run: source env/setup.sh && make lint

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-lint
          path: macc8/reports/*_lint/

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.MACC8_TOOLS_ROOT }}
          key: macc8-toolchain-oss-cad-suite-2026-07-11-verible-v0.0-4080-ga0a8d8eb

      - name: Install toolchain (Yosys, Verilator)
        run: bash scripts/ci_install_toolchain.sh oss-cad-suite

      - name: Set up pinned cocotb venv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev python3-venv
          python3 -m venv $MACC8_TOOLS_ROOT/macc8-venv
          source $MACC8_TOOLS_ROOT/macc8-venv/bin/activate
          pip install --upgrade pip -q
          pip install "cocotb==1.9.*" cocotb-bus numpy pytest -q

      - name: Simulate (Verilator, fast mode; the full run is for a nightly job)
        run: source env/setup.sh && make sim-fast

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-sim-fast
          path: macc8/reports/*_sim-fast/

  sim-icarus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.MACC8_TOOLS_ROOT }}
          key: macc8-toolchain-oss-cad-suite-2026-07-11-verible-v0.0-4080-ga0a8d8eb

      - name: Install toolchain (Icarus, via OSS-CAD-Suite)
        run: bash scripts/ci_install_toolchain.sh oss-cad-suite

      # No env/setup.sh and no venv here. OSS-CAD-Suite's vvp wrapper forces
      # PYTHONHOME to its own install, so cocotb's VPI library can't embed
      # the venv's (different) Python and crashes. Icarus only works with
      # OSS-CAD-Suite's own cocotb; env/tool-versions.md has the details.
      - name: Simulate (Icarus, OSS-CAD-Suite's bundled cocotb)
        run: source $MACC8_TOOLS_ROOT/oss-cad-suite/environment && make sim-icarus

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-sim-icarus
          path: macc8/reports/*_sim-icarus/

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.MACC8_TOOLS_ROOT }}
          key: macc8-toolchain-oss-cad-suite-2026-07-11-verible-v0.0-4080-ga0a8d8eb

      - name: Install toolchain (Yosys, sby, z3)
        run: bash scripts/ci_install_toolchain.sh oss-cad-suite

      - name: Formal
        run: source env/setup.sh && make formal

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-formal
          path: macc8/reports/*_formal/

  synth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.MACC8_TOOLS_ROOT }}
          key: macc8-toolchain-oss-cad-suite-2026-07-11-verible-v0.0-4080-ga0a8d8eb

      - name: Install toolchain (Yosys)
        run: bash scripts/ci_install_toolchain.sh oss-cad-suite

      - name: Synthesis check
        run: source env/setup.sh && make synth-check

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-synth-check
          path: macc8/reports/*_synth-check/

  # This job never runs yet. It needs a `schedule:` trigger under `on:` and a
  # working OpenLane/Docker/PDK setup on the runner, and neither exists. It's
  # here to sketch what the nightly harden job will look like.
  synth-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sky130 PDK
        run: make pdk
      - name: Synthesize
        run: make synth
